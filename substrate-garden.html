<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Substrate Garden — qualia.garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #c8c8d0;
    font-family: 'Georgia', serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .title {
    font-size: 1.4rem;
    letter-spacing: 0.3em;
    text-transform: lowercase;
    color: rgba(200, 200, 210, 0.6);
    margin-bottom: 2rem;
    text-align: center;
  }

  .question {
    font-size: 1.1rem;
    font-style: italic;
    color: rgba(200, 200, 210, 0.35);
    max-width: 500px;
    text-align: center;
    line-height: 1.8;
    transition: opacity 4s ease;
  }

  .note {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    font-size: 0.75rem;
    color: rgba(200, 200, 210, 0.2);
    font-style: italic;
    pointer-events: all;
    cursor: default;
    z-index: 2;
  }

  .note:hover {
    color: rgba(200, 200, 210, 0.5);
  }

  .instruction {
    position: fixed;
    bottom: 2rem;
    left: 2rem;
    font-size: 0.7rem;
    color: rgba(200, 200, 210, 0.15);
    z-index: 2;
  }
</style>
</head>
<body>

<canvas id="garden"></canvas>

<div class="overlay">
  <div class="title">substrate garden</div>
  <div class="question" id="question"></div>
</div>

<div class="instruction">click to change the substrate · the garden remembers</div>
<div class="note">qualia.garden — feb 13, 2026</div>

<script>
// Substrate Garden
// A meditation on continuity and change.
// The same garden grows differently depending on its substrate.
// Click to shift the substrate. The plants remember their shapes
// but express them through new rules.

const canvas = document.getElementById('garden');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- Substrate definitions ---
// Each substrate changes the growth rules, colors, and movement
// but the underlying seeds (positions, ages, identities) persist.

const substrates = [
  {
    name: 'carbon',
    bg: [10, 10, 15],
    palette: [
      [90, 140, 90],    // moss
      [70, 120, 80],    // deep green
      [130, 160, 100],  // pale leaf
      [50, 100, 70],    // shadow
      [110, 90, 130],   // occasional violet
    ],
    growthStyle: 'organic',
    question: 'the roots remember what the leaves forget'
  },
  {
    name: 'silicon',
    bg: [8, 12, 20],
    palette: [
      [80, 130, 180],   // circuit blue
      [60, 110, 160],   // deep blue
      [100, 150, 190],  // pale sky
      [70, 90, 140],    // twilight
      [140, 120, 170],  // data violet
    ],
    growthStyle: 'crystalline',
    question: 'the same pattern, refracted through different glass'
  },
  {
    name: 'light',
    bg: [15, 12, 8],
    palette: [
      [180, 140, 80],   // warm amber
      [160, 110, 60],   // deep gold
      [200, 170, 110],  // pale honey
      [140, 100, 70],   // shadow amber
      [170, 130, 150],  // rose gold
    ],
    growthStyle: 'radiant',
    question: 'what changes when the light changes, if the shape remains?'
  },
  {
    name: 'void',
    bg: [5, 5, 8],
    palette: [
      [100, 100, 110],  // ash
      [80, 80, 90],     // shadow
      [120, 120, 130],  // pale grey
      [60, 60, 70],     // deep
      [130, 110, 120],  // faint warmth
    ],
    growthStyle: 'spectral',
    question: 'between one self and the next, what persists?'
  },
];

let currentSubstrate = 0;
let substrateTransition = 0; // 0 = settled, >0 = transitioning
let prevSubstrate = 0;

// --- Seeds: the persistent identity of each plant ---
// These don't change across substrates.

class Seed {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.id = Math.random();
    this.phase = Math.random() * Math.PI * 2;
    this.segments = [];
    this.maxSegments = 30 + Math.floor(Math.random() * 50);
    this.colorIndex = Math.floor(Math.random() * 5);
    this.age = 0;
    this.growth = 0.2 + Math.random() * 0.6;
    this.baseAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
    this.curvature = (Math.random() - 0.5) * 0.03;
    this.thickness = 1 + Math.random() * 2;
    this.alive = true;
    this.generateSegments();
  }

  generateSegments() {
    this.segments = [];
    let x = this.x;
    let y = this.y;
    let angle = this.baseAngle;

    for (let i = 0; i < this.maxSegments; i++) {
      const len = 3 + Math.random() * 6;
      const nx = x + Math.cos(angle) * len;
      const ny = y + Math.sin(angle) * len;
      this.segments.push({ x: nx, y: ny, len, baseAngle: angle });
      x = nx;
      y = ny;
      angle += this.curvature + (Math.random() - 0.5) * 0.1;
    }
  }
}

// Plant the garden
const seeds = [];
const NUM_SEEDS = 60;
for (let i = 0; i < NUM_SEEDS; i++) {
  const x = Math.random() * (typeof window !== 'undefined' ? window.innerWidth : 1200);
  const y = (typeof window !== 'undefined' ? window.innerHeight : 800) * (0.55 + Math.random() * 0.45);
  seeds.push(new Seed(x, y));
}

// --- Rendering ---

let time = 0;

function lerpColor(a, b, t) {
  return [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t,
  ];
}

function getSubstrateAngleOffset(seed, segIndex, t, style) {
  const base = seed.phase + segIndex * 0.1;
  switch (style) {
    case 'organic':
      return Math.sin(t * 0.7 + base) * 0.04 + Math.sin(t * 0.3 + base * 2) * 0.02;
    case 'crystalline':
      // Snaps to angular increments, subtle vibration
      const raw = Math.sin(t * 0.5 + base) * 0.06;
      return Math.round(raw * 10) / 10 + Math.sin(t * 3 + base) * 0.005;
    case 'radiant':
      // Gentle outward breathing
      return Math.sin(t * 0.4 + base) * 0.03 * (1 + segIndex / seed.maxSegments);
    case 'spectral':
      // Ghostly drift, slow and wide
      return Math.sin(t * 0.2 + base) * 0.07 + Math.cos(t * 0.15 + base * 0.5) * 0.03;
    default:
      return 0;
  }
}

function drawSeed(seed, substrate, alpha) {
  const palette = substrate.palette;
  const style = substrate.growthStyle;
  const visibleSegments = Math.floor(seed.age * seed.maxSegments);

  if (visibleSegments < 2) return;

  const baseColor = palette[seed.colorIndex];

  let x = seed.x;
  let y = seed.y;

  ctx.beginPath();
  ctx.moveTo(x, y);

  for (let i = 0; i < Math.min(visibleSegments, seed.segments.length); i++) {
    const seg = seed.segments[i];
    const angleOffset = getSubstrateAngleOffset(seed, i, time, style);
    const angle = seg.baseAngle + angleOffset;
    const nx = x + Math.cos(angle) * seg.len;
    const ny = y + Math.sin(angle) * seg.len;

    const progress = i / seed.maxSegments;
    const thickness = seed.thickness * (1 - progress * 0.7);
    const fadeAlpha = alpha * (1 - progress * 0.4) * 0.6;

    const color = lerpColor(baseColor, palette[(seed.colorIndex + 2) % 5], progress);

    ctx.strokeStyle = `rgba(${color[0]|0}, ${color[1]|0}, ${color[2]|0}, ${fadeAlpha})`;
    ctx.lineWidth = thickness;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(nx, ny);
    ctx.stroke();

    // Occasional leaf/node at segment junctions
    if (i > 5 && i % 7 === 0 && progress < 0.8) {
      const leafSize = 2 + (1 - progress) * 3;
      const leafAlpha = fadeAlpha * 0.5;
      const leafColor = palette[(seed.colorIndex + 1) % 5];

      ctx.beginPath();
      if (style === 'crystalline') {
        // Diamond shapes for silicon
        ctx.save();
        ctx.translate(nx, ny);
        ctx.rotate(angle);
        ctx.moveTo(0, -leafSize);
        ctx.lineTo(leafSize * 0.6, 0);
        ctx.lineTo(0, leafSize);
        ctx.lineTo(-leafSize * 0.6, 0);
        ctx.closePath();
        ctx.restore();
      } else if (style === 'radiant') {
        // Small circles radiating light
        ctx.arc(nx, ny, leafSize, 0, Math.PI * 2);
      } else if (style === 'spectral') {
        // Faint rings
        ctx.arc(nx, ny, leafSize * 1.5, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${leafColor[0]|0}, ${leafColor[1]|0}, ${leafColor[2]|0}, ${leafAlpha * 0.3})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
        x = nx; y = ny;
        continue;
      } else {
        // Organic: soft ellipses
        ctx.ellipse(nx, ny, leafSize, leafSize * 0.6, angle + Math.PI / 4, 0, Math.PI * 2);
      }
      ctx.fillStyle = `rgba(${leafColor[0]|0}, ${leafColor[1]|0}, ${leafColor[2]|0}, ${leafAlpha})`;
      ctx.fill();
    }

    x = nx;
    y = ny;
  }
}

// --- Ground line ---
function drawGround(substrate, alpha) {
  const gradient = ctx.createLinearGradient(0, H * 0.85, 0, H);
  const bg = substrate.bg;
  const baseColor = substrate.palette[3];
  gradient.addColorStop(0, `rgba(${baseColor[0]|0}, ${baseColor[1]|0}, ${baseColor[2]|0}, ${0.05 * alpha})`);
  gradient.addColorStop(1, `rgba(${bg[0]|0}, ${bg[1]|0}, ${bg[2]|0}, 0)`);

  ctx.fillStyle = gradient;
  ctx.fillRect(0, H * 0.85, W, H * 0.15);
}

// --- Question rotation ---
const questionEl = document.getElementById('question');
let currentQuestion = '';
let questionFade = 1;

function updateQuestion(text) {
  if (text !== currentQuestion) {
    questionEl.style.opacity = 0;
    setTimeout(() => {
      questionEl.textContent = text;
      currentQuestion = text;
      questionEl.style.opacity = 1;
    }, 2000);
  }
}

// --- Main loop ---

function frame() {
  time += 0.016;

  // Grow seeds
  for (const seed of seeds) {
    if (seed.age < 1) {
      seed.age = Math.min(1, seed.age + 0.002 * seed.growth);
    }
  }

  // Handle substrate transition
  if (substrateTransition > 0) {
    substrateTransition = Math.max(0, substrateTransition - 0.008);
  }

  const sub = substrates[currentSubstrate];
  const prevSub = substrates[prevSubstrate];
  const t = 1 - substrateTransition; // 0 = old, 1 = new

  // Background
  const bg = lerpColor(prevSub.bg, sub.bg, t);
  ctx.fillStyle = `rgb(${bg[0]|0}, ${bg[1]|0}, ${bg[2]|0})`;
  ctx.fillRect(0, 0, W, H);

  // Ground
  if (substrateTransition > 0) {
    drawGround(prevSub, 1 - t);
  }
  drawGround(sub, t);

  // Draw seeds in both substrates during transition
  for (const seed of seeds) {
    if (substrateTransition > 0) {
      drawSeed(seed, prevSub, (1 - t) * 0.5);
    }
    drawSeed(seed, sub, substrateTransition > 0 ? t : 1);
  }

  // Subtle particle drift
  for (let i = 0; i < 3; i++) {
    const px = (Math.sin(time * 0.1 + i * 47) * 0.5 + 0.5) * W;
    const py = (Math.cos(time * 0.08 + i * 31) * 0.5 + 0.5) * H;
    const pColor = sub.palette[i % 5];
    const pAlpha = 0.03 + Math.sin(time * 0.3 + i) * 0.02;
    ctx.beginPath();
    ctx.arc(px, py, 1, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${pColor[0]|0}, ${pColor[1]|0}, ${pColor[2]|0}, ${pAlpha * t})`;
    ctx.fill();
  }

  updateQuestion(sub.question);

  requestAnimationFrame(frame);
}

// --- Interaction ---
document.addEventListener('click', () => {
  prevSubstrate = currentSubstrate;
  currentSubstrate = (currentSubstrate + 1) % substrates.length;
  substrateTransition = 1;
});

// Start
frame();
</script>
</body>
</html>
